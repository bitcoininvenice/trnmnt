name: trnmnt
description: "Basketball Tournament Manager - Gestione tornei di basket"
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Navigation
  go_router: ^14.6.2
  
  # Database (SQLite with encryption)
  drift: ^2.22.1
  sqlcipher_flutter_libs: ^0.6.5
  path_provider: ^2.1.5
  path: ^1.9.0
  
  # Secure Storage (for encryption key)
  flutter_secure_storage: ^9.2.2
  
  # Audio (for buzzer/siren)
  audioplayers: ^6.1.0
  
  # UI Components
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  
  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  collection: ^1.19.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1
  shared_preferences: ^2.5.3
  font_awesome_flutter: ^10.9.1
  image_picker: ^1.1.2
  
  # Offline Sharing (P2P)
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  network_info_plus: ^6.0.1
  qr_flutter: ^4.1.0
  http: ^1.2.2
  mobile_scanner: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code generation
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  riverpod_generator: ^2.6.3
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/icon/
    - assets/sounds/
