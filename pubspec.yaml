name: trnmnt
description: "Basketball Tournament Manager - Gestione tornei di basket"
publish_to: 'none'
version: 4.5.1+451

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Navigation
  go_router: ^14.6.2
  
  # Database (SQLite Standard Ultra-Fast)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.25
  path_provider: ^2.1.5
  path: ^1.9.0
  
  # Audio (for buzzer/siren)
  audioplayers: ^6.1.0
  
  # UI Components
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  
  # Utilities
  intl: ^0.20.2
  collection: ^1.19.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.2
  webview_flutter: ^4.10.0
  package_info_plus: ^9.0.1
  shared_preferences: ^2.5.3
  font_awesome_flutter: ^10.9.1
  image_picker: ^1.1.2
  
  # Cloud Sharing & QR
  qr_flutter: ^4.1.0
  http: ^1.2.2
  mobile_scanner: ^6.0.4
  supabase_flutter: ^2.12.2
  flutter_dotenv: ^6.0.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code generation
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  riverpod_generator: ^2.6.3
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/icon/
    - assets/sounds/
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/logo.png"
  min_sdk_android: 21 # flutter_launcher_icons 0.13.1+ requires this
  remove_alpha_ios: true
